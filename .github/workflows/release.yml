name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      ContinuousIntegrationBuild: true
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check the tag names the package's version
        run: |
          version=$(dotnet msbuild Plan9.Utf/Plan9.Utf.csproj -getProperty:Version)
          if [[ "v$version" != "$TAG" ]]; then
            echo "The tag $TAG does not name version $version" >&2
            exit 1
          fi

      - name: Build, test and pack
        run: bash scripts/run-quality.sh

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: kiljoy001

      - name: Push to nuget.org
        run: dotnet nuget push ".artifacts/package/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
